<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LayerLab — редактор изображений</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">◩</span><strong>LayerLab</strong><small>image studio</small></div><nav><button id="newBtn">Новый</button><button id="openBtn">Открыть</button><button id="saveBtn">Сохранить проект</button><button id="loadBtn">Загрузить проект</button><button id="exportBtn" class="primary">Экспорт PNG</button><select id="exportFormat" title="Формат экспорта"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select></nav><div class="right"><button id="undoBtn" title="Отменить Ctrl+Z">↶</button><button id="redoBtn" title="Повторить Ctrl+Y">↷</button><span id="status">Готово</span></div></header>
<main><aside class="tools" id="tools"><button data-tool="move" class="active" title="Перемещение (V)">✥</button><button data-tool="brush" title="Кисть (B)">✎</button><button data-tool="eraser" title="Ластик (E)">◩</button><button data-tool="rect" title="Прямоугольник (R)">▭</button><button data-tool="ellipse" title="Эллипс (O)">◯</button><button data-tool="text" title="Текст (T)">T</button><button data-tool="line" title="Линия (L)">╱</button><button data-tool="gradient" title="Градиент (G)">◪</button><button data-tool="select" title="Прямоугольное выделение (M)">▣</button><button data-tool="bucket" title="Заливка (K)">▤</button><button data-tool="eyedropper" title="Пипетка (I)">◉</button><div class="separate"></div><label title="Основной цвет"><input id="color" type="color" value="#8c7bff"></label></aside>
<section class="workspace"><div class="options"><b id="toolName">Перемещение</b><label>Размер <input type="range" id="size" min="1" max="120" value="18"><output id="sizeOut">18</output></label><label>Прозрачность <input type="range" id="opacity" min="1" max="100" value="100"><output id="opacityOut">100%</output></label><button id="clearSelection" title="Снять выделение Ctrl+D">Снять выделение</button><div class="spacer"></div><button id="fitBtn">Вписать</button><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button></div><div id="viewport"><div id="stage"><canvas id="canvas"></canvas><canvas id="overlay"></canvas></div></div><div class="bottom"><span id="dimensions">1200 × 800 px</span><span>Ctrl+Z отмена · Ctrl+D снять выделение · Ctrl+S сохранить · колесо + Ctrl масштаб</span></div></section>
<aside class="panel"><div class="panelTop"><h3>Свойства</h3><div class="field"><label>Имя слоя</label><input id="layerName" placeholder="Выберите слой"></div><div class="field"><label>Непрозрачность слоя</label><input type="range" id="layerOpacity" min="0" max="100" value="100"></div><div class="field"><label>Режим наложения</label><select id="blend"><option value="source-over">Обычный</option><option value="multiply">Умножение</option><option value="screen">Экран</option><option value="overlay">Перекрытие</option></select></div></div><div class="panelTop extra"><h3>Коррекция и трансформация</h3><div class="quick"><button id="rotateLeft" title="Повернуть слой налево">↶ 90°</button><button id="rotateRight" title="Повернуть слой направо">↷ 90°</button><button id="flipX">Отразить ↔</button><button id="flipY">Отразить ↕</button></div><div class="field"><label>Яркость <output id="brightnessOut">0</output></label><input id="brightness" type="range" min="-100" max="100" value="0"></div><div class="field"><label>Контраст <output id="contrastOut">0</output></label><input id="contrast" type="range" min="-100" max="100" value="0"></div><div class="field"><label>Насыщенность <output id="saturationOut">0</output></label><input id="saturation" type="range" min="-100" max="100" value="0"></div><div class="quick"><button id="applyAdjustments">Применить</button><button id="grayscale">Ч/Б</button><button id="invert">Инверсия</button></div><div class="quick"><button id="resizeDoc">Размер холста</button><button id="flatten">Свести слои</button></div></div><div class="layerHead"><h3>Слои</h3><div><button id="addLayer" title="Добавить слой">＋</button><button id="duplicateLayer" title="Дублировать">▣</button><button id="deleteLayer" title="Удалить">🗑</button></div></div><div id="layers"></div><div class="hint">Перетаскивай слои для изменения порядка. Двойной клик по имени — переименование.</div></aside></main>
<input type="file" id="fileInput" accept="image/*" hidden><input type="file" id="projectInput" accept=".json,application/json" hidden><script src="app.js"></script></body></html>
